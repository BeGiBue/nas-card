name: Patch NAS card layout

on:
  push:
    paths:
      - '.github/workflows/patch-nas.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch nas-card.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nas-card.js')
          s = p.read_text()
          s = s.replace('// NAS Card v1.0.1', '// NAS Card v1.0.2')
          s = s.replace('const NAS_CARD_VERSION="1.0.1";', 'const NAS_CARD_VERSION="1.0.2";')
          s = s.replace('<span><b>${this._e(this._f(id))}</b><small>${l}</small></span>', '<span><small>${l}</small><b>${this._e(this._f(id))}</b></span>')
          s = s.replace('.hero{position:relative;min-height:182px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;overflow:hidden}', '.hero{position:relative;min-height:235px;padding:16px;display:flex;flex-direction:column;justify-content:flex-start;gap:12px;overflow:hidden}')
          s = s.replace('.metrics{z-index:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}', '.metrics{z-index:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:90px}')
          s = s.replace('.dm{border:0;border-left:1px solid var(--bord);background:transparent;padding:6px 9px;display:flex;align-items:center;gap:7px;min-width:0}', '.dm{border:0;border-left:1px solid var(--bord);background:transparent;padding:6px 9px;display:flex;align-items:center;justify-content:center;text-align:center;gap:7px;min-width:0}.dm span{align-items:center}')
          s = s.replace('@media(max-width:560px){.hero{min-height:315px;padding:18px;gap:16px}', '@media(max-width:560px){.hero{min-height:235px;padding:18px;gap:16px}')
          s = s.replace('.metrics{margin-top:112px;gap:9px}', '.metrics{margin-top:88px;gap:9px}')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nas-card.js
          git diff --cached --quiet && exit 0
          git commit -m 'Refine NAS spacing and drive value layout'
          git push
