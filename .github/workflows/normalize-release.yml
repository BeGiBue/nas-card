name: Normalize release metadata

on:
  push:
    paths:
      - '.github/workflows/normalize-release.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Normalize metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('nas-card-core.js')
          text = path.read_text()
          text = text.replace('CC BY-NC 4.0', 'AGPL-3.0-only')
          text = text.replace('https://github.com/BeGiBue/nas_card', 'https://github.com/BeGiBue/nas-card')
          path.write_text(text)
          PY
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/BeGiBue/ortsnetz-map-card/main/LICENSE \
            --output LICENSE
      - name: Commit normalized files
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nas-card-core.js LICENSE
          git commit -m 'Normalize release metadata'
          git push
